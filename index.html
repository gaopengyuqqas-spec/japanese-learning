<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15324b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="日语随身学" />
  <meta name="description" content="以汉字、训读、音读、例句和场景对话为核心的个人日语学习 PWA。" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />
  <title>日语随身学</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY JAPANESE LAB</p>
        <h1 id="page-title">今日学习</h1>
      </div>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题">◐</button>
    </header>

    <main id="main-content" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要导航">
      <button class="nav-item active" data-route="home" type="button"><span>⌂</span><small>首页</small></button>
      <button class="nav-item" data-route="vocab" type="button"><span>字</span><small>单词</small></button>
      <button class="nav-item" data-route="dialogue" type="button"><span>会</span><small>对话</small></button>
      <button class="nav-item" data-route="review" type="button"><span>↻</span><small>复习</small></button>
      <button class="nav-item" data-route="settings" type="button"><span>⚙</span><small>设置</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <input id="import-file" type="file" accept="application/json" hidden />
  <script src="./app.js" defer></script>
</body>
</html>
